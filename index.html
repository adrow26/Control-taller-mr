async function obtenerTrabajos(filtroFecha = null, mecanico_id = null, rango = null, soloPagados = false) {
  let {data} = await supabaseClient.rpc('obtener_trabajos')
  if(!data) return []

  if(mecanico_id) data = data.filter(t => String(t.mecanico_id) === String(mecanico_id))

  if(soloPagados) {
    data = data.filter(t => t.estado === 'pagado')
    data = data.filter(t => {
      const ref = t.fecha_pago ? new Date(t.fecha_pago) : new Date(t.created_at)
      const hoy = new Date()
      if(filtroFecha === 'dia') return ref.toDateString() === hoy.toDateString()
      if(filtroFecha === 'semana') return ref >= new Date(hoy.getTime() - 7*24*60*60*1000)
      if(filtroFecha === 'rango' && rango && rango.desde && rango.hasta) {
        const desde = new Date(rango.desde + 'T00:00:00')
        const hasta = new Date(rango.hasta + 'T23:59:59')
        return ref >= desde && ref <= hasta
      }
      return true
    })
  } else if(filtroFecha) {
    const hoy = new Date()
    data = data.filter(t => {
      const fecha = new Date(t.created_at)
      if(filtroFecha === 'dia') return fecha.toDateString() === hoy.toDateString()
      if(filtroFecha === 'semana') return fecha >= new Date(hoy.getTime() - 7*24*60*60*1000)
      return true
    })
  }
  return data
}

async function cambiarEstadoTrabajo(id) {
  const {error} = await supabaseClient.rpc('cambiar_estado_trabajo', {p_id: id, p_nuevo_estado: 'pagado'})
  if(!error) {
    mostrarAviso('Orden marcada como PAGADO ✅')
    if(idTrabajoEdicion === id) cancelarEdicion();
    document.getElementById('tablaTrabajos').innerHTML = await cargarTablaTrabajos(document.getElementById('buscadorHistorial')?.value)
  } else {
    mostrarAviso('Error al cambiar estado')
    console.error(error)
  }
}

function formatearRepuestosHistorial(repuestosStr) {
  if (!repuestosStr || repuestosStr === '-' || repuestosStr === 'S/R') return '-';
  const { items } = parseRepuestos(repuestosStr);
  if (items.length === 0) return '-';
  
  return `<ol class="repuestos-lista-historial">
    ${items.map(item => `<li>${item.detalle} (Bs ${item.precio.toFixed(2)})</li>`).join('')}
  </ol>`;
}

async function cargarTablaTrabajos(filtro = '') {
  const trabajos = await obtenerTrabajos()
  trabajosCache = trabajos
  return renderFilasTrabajos(filtrarTrabajosPorTexto(trabajos, filtro))
}

function filtrarTrabajosPorTexto(lista, filtro) {
  const q = (filtro || '').trim().toLowerCase()
  if(!q) return lista
  return lista.filter(t => (t.orden_trabajo || '').toLowerCase().includes(q))
}

function buscarEnHistorial() {
  const q = document.getElementById('buscadorHistorial').value
  document.getElementById('tablaTrabajos').innerHTML = renderFilasTrabajos(filtrarTrabajosPorTexto(trabajosCache, q))
}

function renderFilasTrabajos(trabajos) {
  return trabajos.map(t => {
    const estado = t.estado || 'pendiente'
    const claseEstado = estado === 'pagado'? 'estado-pagado' : 'estado-pendiente'

    const acciones = estado === 'pendiente' ?
      `<button class="btn-pagado" onclick="cambiarEstadoTrabajo(${t.id})">Marcar Pagado</button>
       <button class="btn-editar" onclick="prepararEdicionTrabajo(${t.id}, '${escapeJsonStr(t.orden_trabajo)}', '${escapeJsonStr(t.repuestos_cambiados)}', ${t.costo_trabajo}, ${t.mecanico_id}, '${escapeJsonStr(t.hora_ingreso)}')">Editar</button>` : '';

    return `
    <tr class="fila-orden" ondblclick="verDetalleOrden(${t.id})">
      <td>${t.created_at? new Date(t.created_at).toLocaleDateString() + ' ' + new Date(t.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '-'}</td>
      <td>${t.hora_ingreso || '-'}</td>
      <td>${t.mecanico_nombre || 'Sin asignar'}</td>
      <td>${t.orden_trabajo}</td>
      <td>${formatearRepuestosHistorial(t.repuestos_cambiados)}</td>
      <td>Bs ${parseFloat(t.costo_repuesto || 0).toFixed(2)}</td>
      <td>Bs ${parseFloat(t.costo_trabajo || 0).toFixed(2)}</td>
      <td><b>Bs ${parseFloat(t.total || 0).toFixed(2)}</b></td>
      <td class="${claseEstado}">${estado.toUpperCase()}</td>
      <td>
        <div class="row" style="gap:5px;" ondblclick="event.stopPropagation()">
          ${acciones}
        </div>
      </td>
    </tr>
  `}).join('')
}

function escapeJsonStr(str) {
  if(!str) return '';
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
}

function prepararEdicionTrabajo(id, orden, repuestosStr, costoTrabajo, mecanicoId, horaIngreso) {
  idTrabajoEdicion = id;
  window.scrollTo({top: 0, behavior: 'smooth'});
  
  document.getElementById('mecanico').value = mecanicoId;
  const sepOrden = orden.indexOf(' | ');
  if(sepOrden !== -1) {
    document.getElementById('placaCliente').value = orden.slice(0, sepOrden);
    document.getElementById('detalleOrden').value = orden.slice(sepOrden + 3);
  } else {
    document.getElementById('placaCliente').value = '';
    document.getElementById('detalleOrden').value = orden;
  }
  document.getElementById('costo_trab').value = costoTrabajo;
  document.getElementById('horaIngreso').value = (horaIngreso && horaIngreso !== 'null') ? horaIngreso : '';
  
  const contenedor = document.getElementById('contenedorRepuestos');
  contenedor.innerHTML = '';
  
  const { items } = parseRepuestos(repuestosStr);
  if (items.length === 0) {
    agregarFilaRepuesto();
  } else {
    items.forEach(item => {
      agregarFilaRepuesto(item.detalle, item.precio);
    });
  }
  
  calcularTotalRepuestos();
  
  document.getElementById('tituloFormulario').innerText = `Editar Orden de Trabajo (ID: ${id})`;
  const btnGuardar = document.getElementById('btnGuardarOrden');
  btnGuardar.innerText = 'Actualizar Orden';
  btnGuardar.style.background = '#ff9800';
  
  document.getElementById('btnCancelarEdicion').style.display = 'inline-block';
}

function cancelarEdicion() {
  idTrabajoEdicion = null;
  document.getElementById('tituloFormulario').innerText = 'Nueva Orden de Trabajo';
  const btnGuardar = document.getElementById('btnGuardarOrden');
  btnGuardar.innerText = 'Guardar Orden';
  btnGuardar.style.background = '#2196F3';
  document.getElementById('btnCancelarEdicion').style.display = 'none';
  
  document.getElementById('placaCliente').value = '';

  document.getElementById('contenedorRepuestos').innerHTML = '';
  agregarFilaRepuesto();
  calcularTotalRepuestos();
}

function calcularTotalRepuestos() {
  const precios = document.getElementsByClassName('rep-pre');
  let totalRep = 0;
  for(let i=0; i<precios.length; i++) {
    totalRep += parseFloat(precios[i].value || 0);
  }
  document.getElementById('costo_rep').value = totalRep.toFixed(2);
  calcularTotal();
}

function calcularTotal() {
  const rep = parseFloat(document.getElementById('costo_rep').value || 0)
  const trab = parseFloat(document.getElementById('costo_trab').value || 0)
  document.getElementById('total').innerText = `Total: Bs ${(rep + trab).toFixed(2)}`
}

function obtenerStringRepuestos() {
  const detalles = document.getElementsByClassName('rep-det');
  const precios = document.getElementsByClassName('rep-pre');
  let resultado = [];
  
  for(let i=0; i<detalles.length; i++) {
    const det = detalles[i].value.trim();
    const pre = parseFloat(precios[i].value || 0);
    if(det) {
      resultado.push(`${det} ${pre}`);
    }
  }
  return resultado.length > 0 ? resultado.join('\n') : 'S/R';
}

async function guardarTrabajo() {
  const mec = document.getElementById('mecanico').value
  const placa = document.getElementById('placaCliente').value.trim()
  const detalle = document.getElementById('detalleOrden').value.trim()
  const horaIngreso = document.getElementById('horaIngreso').value
  const costoTrabRaw = document.getElementById('costo_trab').value.trim()

  if(!costoTrabRaw || parseFloat(costoTrabRaw) <= 0) {
    alert('⚠️ Espacio Obligatorio: Debe llenar el costo del trabajo (Mano de Obra).')
    mostrarAviso('Llene el costo del trabajo')
    return
  }

  if(!mec ||!placa ||!detalle) return mostrarAviso('Selecciona mecánico y llena la placa/cliente y el detalle de la orden')

  const orden = `${placa} | ${detalle}`

  const repuestosString = obtenerStringRepuestos();
  const costoRep = document.getElementById('costo_rep').value;

  if (idTrabajoEdicion) {
    const exito = await actualizarTrabajoExistente(idTrabajoEdicion, mec, orden, repuestosString, costoRep, costoTrabRaw, horaIngreso);
    if(exito) {
      await guardarDetalleComunSiNuevo(detalle);
      mostrarAviso(`Orden ${orden} actualizada con éxito ✅`);
      mostrarTrabajos();
    } else {
      mostrarAviso('Error al actualizar la orden ❌');
    }
  } else {
    await insertarTrabajo(mec, orden, repuestosString, costoRep, costoTrabRaw, horaIngreso);
    await guardarDetalleComunSiNuevo(detalle);
    mostrarAviso(`Orden ${orden} guardada ✅`);
    mostrarTrabajos();
  }
}

async function reporteGanancias(tipo, mecanico_id = null, rango = null) {
  const trabajos = await obtenerTrabajos(tipo, mecanico_id, rango, true)
  const hoy = new Date()
  let fecha_texto = 'Todos'
  if(tipo === 'dia') fecha_texto = hoy.toLocaleDateString()
  if(tipo === 'semana') fecha_texto = `${new Date(hoy.getTime() - 7*24*60*60*1000).toLocaleDateString()} al ${hoy.toLocaleDateString()}`
  if(tipo === 'rango' && rango) fecha_texto = `${formatearFechaCorta(rango.desde)} al ${formatearFechaCorta(rango.hasta)}`

  const agrupado = {}
  trabajos.forEach(t => {
    const nombre = t.mecanico_nombre || 'Sin asignar'
    if(!agrupado[nombre]) agrupado[nombre] = {trabajos: [], ganancia: 0}
    agrupado[nombre].trabajos.push({
      orden: t.orden_trabajo,
      repuestos: t.repuestos_cambiados,
      fecha: new Date(t.created_at).toLocaleDateString(),
      fechaPago: t.fecha_pago ? new Date(t.fecha_pago).toLocaleDateString() : '-',
      ganancia: parseFloat(t.costo_trabajo || 0),
      estado: t.estado
    })
    agrupado[nombre].ganancia += parseFloat(t.costo_trabajo || 0)
  })

  return [Object.keys(agrupado).map(nombre => [nombre, agrupado[nombre].trabajos, agrupado[nombre].ganancia]), fecha_texto]
}

function formatearFechaCorta(iso) {
  if(!iso) return ''
  const [y, m, d] = iso.split('-')
  return `${d}/${m}/${y}`
}

function etiquetaTipoReporte(tipo) {
  return {dia: 'Hoy', semana: 'Última semana', rango: 'Rango de fechas'}[tipo] || tipo
}

function parseRepuestos(repuestosStr) {
  if (!repuestosStr || repuestosStr === 'S/R' || repuestosStr === '-') return {items: [], total: 0}

  const items = []
  const lineas = repuestosStr.split('\n')

  lineas.forEach(linea => {
    linea = linea.trim()
    if (!linea) return

    const match = linea.match(/(.+?)\s+(\d+\.?\d*)$/)
    if (match) {
      items.push({detalle: match[1].trim(), precio: parseFloat(match[2])})
    } else {
      items.push({detalle: linea, precio: 0})
    }
  })

  const total = items.reduce((sum, item) => sum + item.precio, 0)
  return {items, total}
}

  doc.text(`Bs ${totalManoObra.toFixed(2)}`, 160, y);
  y += 7;
  doc.text('TOTAL REPUESTOS:', 20, y);
  doc.text(`Bs ${totalGeneralRepuestos.toFixed(2)}`, 160, y);
  y += 7;
  doc.line(20, y - 5, 190, y - 5);
  doc.text('TOTAL GENERAL:', 20, y);
  doc.text(`Bs ${(totalManoObra + totalGeneralRepuestos).toFixed(2)}`, 160, y);

  doc.save(`reporte_${tipoReporteActual}_${Date.now()}.pdf`);
}
  
function urlToBase64(url) {
  return new Promise((resolve, reject) => {
    const img = new Image()
    img.crossOrigin = 'anonymous'
    img.onload = () => {
      const canvas = document.createElement('canvas')
      canvas.width = img.width
      canvas.height = img.height
      canvas.getContext('2d').drawImage(img, 0, 0)
      resolve(canvas.toDataURL('image/png'))
    }
    img.onerror = reject
    img.src = url
  })
}

async function cargarReporte(tipo, rango = null) {
    tipoReporteActual = tipo;
    rangoActual = tipo === 'rango' ? rango : null;

    const select = document.getElementById('filtroMec');
    const mecId = select?.value;
    const mostrarMecanico = !mecId || mecId === 'todos';
    mecanicoNombreActual = mostrarMecanico ? 'Todos' : (mecanicosCache.find(m => String(m.id) === String(mecId))?.nombre || 'Todos');

    const [datos, fechaTexto] = await reporteGanancias(tipo, mostrarMecanico ? null : mecId, rango);

    datosReporteActuales = datos;
    fechaTextoActual = fechaTexto;

    document.getElementById('fechaLabel').innerText = `Período: ${etiquetaTipoReporte(tipo)} — ${fechaTexto}`;
    const total = datos.reduce((sum, d) => sum + (d[2] || 0), 0);
    document.getElementById('totalGeneral').innerText = `Ganancia Mano de Obra: Bs ${total.toFixed(2)}`;

    let totalRepuestosGlobal = 0;
    datos.forEach(d => {
        d[1].forEach(t => {
            totalRepuestosGlobal += parseRepuestos(t.repuestos).total;
        });
    });

    document.getElementById('contenedorReporte').innerHTML = datos.length > 0
        ? generarHTMLReporteDetallado(datos, totalRepuestosGlobal, mostrarMecanico)
        : '<p style="text-align:center; color: grey; padding: 15px;">Sin órdenes pagadas para este período</p>';
}

function aplicarRangoReporte() {
    const desde = document.getElementById('fechaDesde').value
    const hasta = document.getElementById('fechaHasta').value
    if(!desde || !hasta) return mostrarAviso('Selecciona ambas fechas')

    const d1 = new Date(desde + 'T00:00:00')
    const d2 = new Date(hasta + 'T00:00:00')
    if(d1 > d2) return mostrarAviso('La fecha "Desde" no puede ser mayor que "Hasta"')

    const diffDias = Math.round((d2 - d1) / (1000*60*60*24)) + 1
    if(diffDias > 45) return mostrarAviso('El intervalo no puede superar 45 días')

    cargarReporte('rango', {desde, hasta})
}
